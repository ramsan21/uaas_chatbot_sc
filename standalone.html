<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAAS Chatbot</title>
<style>
  :root {
    --blue: #0473EA;
    --blue-dark: #045fc0;
    --green: #38D200;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #1f2430;
  }
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: 300px;
    flex: 0 0 auto;
    background: #ffffff;
    border-right: 1px solid #e7eaf0;
    padding: 0.6rem 1rem 2rem 1rem;
    overflow-y: auto;
  }
  .side-title {
    font-size: 1.18rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 12px 2px;
  }
  .group {
    border: 1px solid #d8dee7;
    border-left: 3px solid var(--blue);
    border-radius: 9px;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    margin-bottom: 6px;
    overflow: hidden;
  }
  .group summary {
    list-style: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    color: var(--blue);
    background: #f8fafc;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid transparent;
  }
  .group[open] summary { border-bottom-color: #e7eaf0; }
  .group summary::-webkit-details-marker { display: none; }
  .group summary .chev {
    transition: transform 0.15s ease;
    color: #667085;
    font-size: 0.8rem;
  }
  .group[open] summary .chev { transform: rotate(90deg); }
  .group-actions {
    display: flex;
    flex-direction: column;
    padding: 4px;
  }
  .qa-btn {
    width: 100%;
    text-align: left;
    border: none;
    background: #ffffff;
    color: #17202c;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 0.95rem;
    font-weight: 500;
    font-family: inherit;
    box-shadow: 0 1px 1.5px rgba(16, 24, 40, 0.07);
    cursor: pointer;
  }
  .qa-btn:hover { color: var(--blue); background: #eef6ff; }
  .qa-btn:active { color: #1a8a00; background: #eafcea; }
  /* ---------------- Main column ---------------- */
  .main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }
  .main-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 1.1rem 2rem 0 2rem;
    max-width: 1250px;
    width: 100%;
    margin: 0 auto;
  }
  .banner {
    background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dark) 100%);
    color: #ffffff;
    font-size: 1.12rem;
    font-weight: 600;
    text-align: center;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(13, 60, 120, 0.25);
  }
  .banner-dot {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 9px;
    vertical-align: middle;
    box-shadow: 0 0 0 3px rgba(56, 210, 0, 0.35);
  }
  .row { display: flex; align-items: flex-start; gap: 10px; margin: 10px 0; }
  .row-user { justify-content: flex-end; }
  .avatar {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    background: #eaf2ff;
    border: 1px solid #bcd8ff;
  }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 80%;
    font-size: 0.98rem;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }
  .bubble-bot {
    background: #f2f4f7;
    border: 1px solid #e4e8ee;
    color: #1f2430;
    border-top-left-radius: 4px;
  }
  .bubble-user {
    background: var(--blue);
    color: #ffffff;
    border-top-right-radius: 4px;
  }
  .bubble code {
    background: #ffffff;
    border: 1px solid #bcd8ff;
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 0.86em;
    color: var(--blue);
    font-family: Consolas, "Courier New", monospace;
  }
  .bubble-user code {
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff;
  }
  .pre {
    background: #101828;
    color: #e6ebf2;
    border-left: 3px solid var(--green);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    overflow-x: auto;
    margin: 6px 0 2px 0;
    font-family: Consolas, "Courier New", monospace;
  }
  .input-bar {
    flex: 0 0 auto;
    max-width: 1250px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 2rem 1.5rem 2rem;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    border: 1px solid #cfd6e0;
    box-shadow: 0 3px 10px rgba(16, 24, 40, 0.08);
    background: #ffffff;
    padding: 6px 8px 6px 18px;
  }
  .input-shell:focus-within { border-color: var(--blue); }
  .input-shell input {
    flex: 1 1 auto;
    border: none;
    outline: none;
    font-size: 1rem;
    font-family: inherit;
    background: transparent;
    padding: 8px 0;
  }
  .input-shell input::placeholder { color: #98a2b3; }
  .send-btn {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--green);
    color: #ffffff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
  }
  .send-btn:hover { filter: brightness(0.95); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8dee7; border-radius: 6px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-title">Quick Actions</div>
  </aside>
  <main class="main">
    <div class="main-scroll" id="mainScroll">
      <div class="banner"><span class="banner-dot"></span>UAAS Chatbot</div>
      <div id="chat"></div>
    </div>
    <div class="input-bar">
      <div class="input-shell">
        <input id="chatInput" type="text" placeholder="Type a message...">
        <button class="send-btn" id="sendBtn" aria-label="Send">&#10148;</button>
      </div>
    </div>
  </main>
</div>

<script>
const APP_NAME = "UAAS Chatbot";
const WELCOME_BODY = "Choose an action from the left-hand panel to get started.";

const ACTION_GROUPS = [
  { id: "user", title: "User", icon: "\u{1F464}", actions: [
    { id: "get_user_info", label: "Get user info" },
    { id: "get_user_status", label: "Get user status" },
    { id: "reset_user", label: "Reset user" },
    { id: "modify_user", label: "Modify user" },
    { id: "get_user_audit", label: "Get user audit" },
    { id: "change_password", label: "Change password" },
  ]},
  { id: "auth", title: "Auth / Keys", icon: "\u{1F511}", actions: [
    { id: "generate_activation_code", label: "Generate activation code" },
    { id: "download_activation_package", label: "Download activation package" },
    { id: "generate_user_jwt", label: "Generate user jwt" },
    { id: "add_service_jwt_key", label: "Add service jwt key" },
  ]},
  { id: "group", title: "Group", icon: "\u{1F465}", actions: [
    { id: "get_group_info", label: "Get group info" },
    { id: "modify_group", label: "Modify group" },
    { id: "update_thumbprint_group", label: "Update thumbprint group" },
  ]},
  { id: "notifications", title: "Notifications", icon: "\u{1F514}", actions: [
    { id: "send_email", label: "Send email" },
    { id: "send_sms", label: "Send sms" },
    { id: "check_email", label: "Check email" },
  ]},
];

const ACTION_RESPONSES = {
  get_user_info:
    "\u{1F464} **Get user info** completed.\n\n```json\n{\n  \"userId\": \"u-10241\",\n  \"userName\": \"demo.user\",\n  \"email\": \"demo.user@acme.com\",\n  \"status\": \"ACTIVE\"\n}\n```",
  get_user_status:
    "✅ **Get user status** completed.\n\nUser `demo.user` is currently **ACTIVE** (last login: today 09:12 UTC).",
  reset_user:
    "♻️ **Reset user** completed.\n\nMFA devices cleared, sessions revoked, and a temporary password `Tmp-8f2k!q` was issued (valid for 24 hours).",
  modify_user:
    "✏️ **Modify user** completed.\n\nUpdated attributes: `department -> Platform Ops`.",
  get_user_audit:
    "\u{1F9FE} **Get user audit** completed.\n\n- 09:12 - LOGIN SUCCESS (10.66.192.41)\n- 08:44 - PASSWORD CHANGE\n- Yesterday - TOKEN REFRESH",
  change_password:
    "\u{1F512} **Change password** completed.\n\nPassword rotated successfully. Next change due in 90 days.",
  generate_activation_code:
    "\u{1F511} **Generate activation code** completed.\n\nActivation code: `ACT-7Q2M-9XZB-4410` (valid for 30 minutes).",
  download_activation_package:
    "\u{1F4E6} **Download activation package** completed.\n\n`uaas-activation-u10241.zip` (2.4 MB) is ready - check the notifications panel for the download link.",
  generate_user_jwt:
    "\u{1F3AB} **Generate user jwt** completed.\n\nJWT issued for `demo.user`, expires in **60 minutes**. Token preview: `eyJhbGciOiJIUzI1NiIs...`",
  add_service_jwt_key:
    "\u{1F9E9} **Add service jwt key** completed.\n\nKey `svc-uaas-2026-01` registered with scope `uaas:read`.",
  get_group_info:
    "\u{1F465} **Get group info** completed.\n\n`grp-platform-admins` - 14 members, 3 service accounts, owner: `p.moore@acme.com`.",
  modify_group:
    "✏️ **Modify group** completed.\n\nDescription updated to `Platform administrators (prod)`.",
  update_thumbprint_group:
    "\u{1F6E1}️ **Update thumbprint group** completed.\n\nThumbprint `9F:2C:AA:...:71D4` added to the group trust store.",
  send_email:
    "\u{1F4E7} **Send email** queued.\n\nTo: `demo.user@acme.com` - Your UAAS access request - status: **QUEUED**.",
  send_sms:
    "\u{1F4F1} **Send sms** queued.\n\nTo: `+65-****-4321` - verification code sent. Status: **QUEUED**.",
  check_email:
    "\u{1F4EC} **Check email** completed.\n\n2 unread messages found (1 activation notice, 1 policy update).",
};

const KEYWORD_ROUTES = {
  get_user_info: ["user info", "who am i"],
  get_user_status: ["user status", "am i active"],
  change_password: ["change password", "reset password"],
  generate_activation_code: ["activation code"],
  generate_user_jwt: ["jwt", "token"],
  send_email: ["send mail", "send email"],
  send_sms: ["sms", "text message"],
  check_email: ["check mail", "inbox"],
};

function respondToAction(actionId) {
  return ACTION_RESPONSES[actionId] || ("✅ Action `" + actionId + "` completed successfully.");
}

function respondToText(text) {
  const lowered = text.trim().toLowerCase();
  for (const [actionId, keywords] of Object.entries(KEYWORD_ROUTES)) {
    if (keywords.some((k) => lowered.includes(k))) return respondToAction(actionId);
  }
  if (["hi", "hello", "hey"].includes(lowered) || lowered.includes("hello")) {
    return "\u{1F44B} Hello! How can I help? Pick a **Quick Action** from the left-hand panel, or type a request.";
  }
  if (lowered.includes("help")) {
    return "\u{1F9ED} I can help with **users, auth/keys, groups and notifications**. Use the Quick Actions panel on the left to get started.";
  }
  return "\u{1F914} I received: \"" + text + "\".\n\nI'm running in demo mode - try a **Quick Action** from the sidebar for a real operation.";
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineFormat(text) {
  let escaped = escapeHtml(text);
  escaped = escaped.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
  return escaped;
}

function toHtml(content) {
  const parts = content.split("```");
  return parts.map((part, index) => {
    if (index % 2 === 0) {
      return inlineFormat(part).replace(/\n/g, "<br>");
    }
    let code = part.replace(/^\n+|\n+$/g, "");
    if (code.includes("\n")) {
      const [first, ...rest] = code.split("\n");
      if (/^[a-zA-Z]+$/.test(first.trim()) && first.trim().length <= 12) {
        code = rest.join("\n");
      }
    }
    return "<div class='pre'>" + escapeHtml(code).replace(/\n/g, "<br>") + "</div>";
  }).join("");
}

const chatEl = document.getElementById("chat");
const mainScroll = document.getElementById("mainScroll");

function appendMessage(role, content, avatar) {
  const defaultAvatar = role === "assistant" ? "\u{1F916}" : "\u{1F9D1}";
  const row = document.createElement("div");
  row.className = "row " + (role === "assistant" ? "row-bot" : "row-user");
  const avatarHtml = "<div class='avatar'>" + (avatar || defaultAvatar) + "</div>";
  const bubbleHtml = "<div class='bubble " + (role === "assistant" ? "bubble-bot" : "bubble-user") + "'>" + toHtml(content) + "</div>";
  row.innerHTML = role === "assistant" ? (avatarHtml + bubbleHtml) : (bubbleHtml + avatarHtml);
  chatEl.appendChild(row);
  mainScroll.scrollTop = mainScroll.scrollHeight;
}

function appendUser(content) { appendMessage("user", content); }
function appendAssistant(content) { appendMessage("assistant", content); }

function buildSidebar() {
  const sidebar = document.getElementById("sidebar");
  ACTION_GROUPS.forEach((group) => {
    const details = document.createElement("details");
    details.className = "group";
    details.open = true;
    const summary = document.createElement("summary");
    summary.innerHTML = "<span class='chev'>&#9656;</span>" + group.icon + " " + group.title;
    details.appendChild(summary);
    const actionsWrap = document.createElement("div");
    actionsWrap.className = "group-actions";
    group.actions.forEach((action) => {
      const btn = document.createElement("button");
      btn.className = "qa-btn";
      btn.textContent = action.label;
      btn.addEventListener("click", () => {
        appendUser(action.label);
        appendAssistant(respondToAction(action.id));
      });
      actionsWrap.appendChild(btn);
    });
    details.appendChild(actionsWrap);
    sidebar.appendChild(details);
  });
}

function initChatInput() {
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const submit = () => {
    const value = input.value.trim();
    if (!value) return;
    appendUser(value);
    appendAssistant(respondToText(value));
    input.value = "";
  };
  sendBtn.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submit();
  });
}

buildSidebar();
initChatInput();
appendAssistant("\u{1F44B} Hello! I'm the **" + APP_NAME + "**.\n\n" + WELCOME_BODY);
</script>
</body>
</html>
